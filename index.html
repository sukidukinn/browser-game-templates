<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Game Templates</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    main { width: min(900px, 92vw); }
    h1 { margin-bottom: .4rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 28px; }
    a { display: block; padding: 22px; border: 1px solid #444; border-radius: 14px; text-decoration: none; color: inherit; background: #191919; }
    a:hover { background: #222; transform: translateY(-1px); }
    small { color: #aaa; }
  </style>
</head>
<body>
  <main>
    <h1>Browser Game Templates</h1>
    <small>GitHub Pagesでそのまま公開できる最小テンプレート</small>
    <div class="grid">
      <a href="./tetris-2d/">
        <h2>2D Tetris Template</h2>
        <p>Canvas + Vanilla JavaScript。依存ライブラリなし。</p>
      </a>
      <a href="./soulslike-3d/">
        <h2>3D Souls-like Template</h2>
        <p>Three.js。攻撃、回避、スタミナ、敵AI、ロックオン。</p>
      </a>
    </div>
  </main>
</body>
</html>
