<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Souls-like Template</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div class="bar"><span>HP</span><i id="hp"></i></div>
    <div class="bar"><span>ST</span><i id="stamina"></i></div>
    <div id="enemyHud" class="bar enemy"><span>ENEMY</span><i id="enemyHp"></i></div>
    <div id="message">クリックで開始</div>
    <div class="help">WASD: 移動 / 左クリック: 攻撃 / Space: 回避 / Shift: ダッシュ / Q: ロックオン / R: リスタート</div>
  </div>
  <canvas id="game"></canvas>
  <script type="module" src="./game.js"></script>
</body>
</html>
